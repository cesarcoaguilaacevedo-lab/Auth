# Configuracion centralizada de auth-service
server.port=8081

# Usuario administrador inicial: activar UNA SOLA VEZ para iniciar el sistema.
# Desactivar luego de crear el usuario administrador.
auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
auth.bootstrap.username=${AUTH_BOOTSTRAP_USERNAME:admin}
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:}

