# Configuracion compartida para los microservicios (proyecto academico)
# Reemplazar los valores de ejemplo antes de subir el repositorio a GitHub.
# IMPORTANTE: si el repositorio es publico, estas credenciales quedaran expuestas.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_sistema_gestion_caja?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Clave compartida SOLO entre los servicios que validen JWT con HS256
# Reemplazar por una clave aleatoria de al menos 32 bytes UTF-8.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Limites de espera para las llamadas entre microservicios
spring.cloud.openfeign.client.config.default.connectTimeout=2500
spring.cloud.openfeign.client.config.default.readTimeout=5000


